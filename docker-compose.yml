services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antimusic-backend
    ports:
      - "3000:3000"
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./library:/library
    environment:
      - PORT=3000
      - LIBRARY_PATH=/library
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antimusic-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
